# Local stack: PostgreSQL + the API. (S3: set S3_BUCKET and AWS credentials; without it packs go to ./storage.)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: zynetix, POSTGRES_PASSWORD: zynetix, POSTGRES_DB: zynetix }
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
volumes:
  pg: {}
